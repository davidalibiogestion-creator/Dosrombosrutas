<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Rutas Comerciales Cantabria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior con pestañas; cada vista es una superficie de trabajo (rejilla semanal, lista, mapa) sobre fondo neutro frío. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d3dadd; --fg:#16222a; --muted:#5b6b74;
  --accent:#0c5f73; --accent-fg:#ffffff; --accent-soft:#d9ecf0;
  --ok:#2f7d4a; --warn:#a86500; --bad:#b4372f; --warn-soft:#fbefd9; --bad-soft:#f8e1de;
  --land:#e4e9e3; --land-line:#b9c4bc; --sea:#e6eff3;
  --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --r4:#eda100; --r5:#e87ba4; --r6:#6250d6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --surface:#172126; --sunk:#111a1e; --line:#2a383f; --fg:#e3eaed; --muted:#93a4ac;
  --accent:#5cc0d4; --accent-fg:#06262e; --accent-soft:#163a43;
  --ok:#6cc48a; --warn:#e3a54a; --bad:#ef8178; --warn-soft:#3a2d14; --bad-soft:#3d1f1c;
  --land:#1d2a27; --land-line:#34463f; --sea:#121c21;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#9085e9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --surface:#172126; --sunk:#111a1e; --line:#2a383f; --fg:#e3eaed; --muted:#93a4ac;
  --accent:#5cc0d4; --accent-fg:#06262e; --accent-soft:#163a43;
  --ok:#6cc48a; --warn:#e3a54a; --bad:#ef8178; --warn-soft:#3a2d14; --bad-soft:#3d1f1c;
  --land:#1d2a27; --land-line:#34463f; --sea:#121c21;
  --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#9085e9; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font:600 15px var(--f-display);letter-spacing:.02em;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg)}
nav.tabs button:hover{color:var(--fg)}
main{padding-block:18px 48px}
h2{font:700 22px var(--f-display);margin:0;text-wrap:balance}
h3{font:600 16px var(--f-display);margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > *{color:var(--fg);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.scroll-x{overflow-x:auto}
/* Rejilla semanal */
.week{display:grid;grid-template-columns:150px repeat(5,minmax(130px,1fr));gap:6px;min-width:820px}
.week .hd{font:600 13px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.week .rep{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-height:92px}
.cell:hover{border-color:var(--muted)}
.cell[aria-pressed="true"]{outline:2px solid var(--accent);border-color:var(--accent)}
.cell .big{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.cell .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.empty{opacity:.6}
.bar-load{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar-load i{display:block;height:100%;background:var(--accent)}
.bar-load i.over{background:var(--bad)}
/* Detalle día */
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:54px 26px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .t{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.stop .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-display);color:#fff}
.stop .nm{font-weight:600}
.stop .ad{font-size:12px;color:var(--muted)}
.stop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stop.pause{grid-template-columns:54px minmax(0,1fr);color:var(--muted);font-size:12px}
.legline{font-size:11px;color:var(--muted);font-family:var(--f-mono);padding-left:88px}
/* Mapa */
.map svg{width:100%;max-width:980px;margin:0 auto;height:auto;display:block;background:var(--sea);border-radius:8px}
.map .land{fill:var(--land);stroke:var(--land-line);stroke-width:1}
.map text{font:600 10px var(--f-body);fill:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
/* Tabla clientes */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:600 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tbody tr:hover{background:var(--sunk)}
td select{padding:3px 4px;font-size:13px}
.tbl{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:20;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;box-shadow:-12px 0 30px rgba(0,0,0,.12)}
.drawer .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.35);z-index:19}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-weight:600;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.cmp td.num,.cmp th.num{text-align:right}
.days{display:flex;gap:4px}
.days label{display:flex;align-items:center;gap:2px;font-size:12px}
/* Navegación: pantallas principales + gestión */
header .bar{gap:12px 20px}
nav.tabs.main button{font-size:17px;padding:8px 16px}
nav.tabs.gest{align-items:center;padding-left:14px;border-left:1px solid var(--line)}
nav.tabs.gest .gl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
nav.tabs.gest button{font-size:14px;padding:6px 10px}
@media (max-width:640px){nav.tabs.gest{border-left:0;padding-left:0;width:100%}}
/* Tira de días */
.daybar{display:flex;align-items:center;gap:6px}
.days-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.day{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;min-width:0}
.day .dn .sh{display:none}
.day .dn{font:600 13px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.day .dd{font:700 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.day .dm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day.today .dm{color:var(--accent);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day[aria-pressed="true"] .dn,.day[aria-pressed="true"] .dm{color:var(--accent-fg)}
@media (max-width:520px){.day .dn .lo{display:none}.day .dn .sh{display:inline}.day{padding:6px 6px;align-items:center}.day .dn{font-size:11px}.day .dd{font-size:22px}.day .dm{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--fg);background:var(--sunk)}
/* Gantt de jornada */
.gantt,.wk-grid{display:flex;flex-direction:column;gap:6px}
.g-row{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.g-row:hover:not(.axis){background:var(--sunk)}
.g-row.axis{cursor:default;padding-top:0}
.g-row.wk{grid-template-columns:70px minmax(0,1fr) 110px;padding:2px 0}
.g-name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-end{text-align:right;color:var(--muted)}
.g-empty{font-size:12px;color:var(--muted);padding-left:4px}
.jb-track{position:relative;height:30px;background:var(--sunk);border-radius:6px}
.jb.sm .jb-track{height:16px;border-radius:4px}
.seg{position:absolute;top:3px;bottom:3px;display:grid;place-items:center;font:700 11px var(--f-display);color:#fff;overflow:hidden;border-radius:4px}
.jb.sm .seg{top:2px;bottom:2px;border-radius:2px}
.seg.visita{background:var(--c);box-shadow:0 0 0 1px var(--surface)}
.seg.viaje{background:color-mix(in srgb,var(--c) 28%,transparent);top:12px;bottom:12px;border-radius:2px}
.jb.sm .seg.viaje{top:6px;bottom:6px}
.seg.pausa{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 6px);opacity:.55}
.jb-fin{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--bad)}
.jb-axis{position:relative;height:16px}
.jb-axis span{position:absolute;transform:translateX(-50%);font:500 11px var(--f-mono);color:var(--muted)}
.lg{display:inline-block;width:16px;height:10px;border-radius:2px}
.lg.visita{background:var(--fg)}
.lg.viaje{height:4px;background:color-mix(in srgb,var(--fg) 35%,transparent)}
.lg.pausa{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px)}
.lg.fin{width:0;height:12px;border-left:2px dashed var(--bad)}
@media (max-width:640px){.jb-axis span.odd{display:none}.seg.visita{font-size:0}.g-row{grid-template-columns:86px minmax(0,1fr) 44px;gap:6px}.g-row.wk{grid-template-columns:52px minmax(0,1fr)}.g-row.wk .g-end{display:none}.legend{gap:8px}}
.wk-rep{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.wk-title{display:flex;align-items:center;gap:8px;padding:4px 0}
/* Tarjetas por comercial */
.cards{display:grid;gap:14px;align-items:start}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.cards.c3{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.cards.c2,.cards.c3{grid-template-columns:1fr}}
.rcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:90px}
.rcard header{display:flex;align-items:center;gap:8px}
.rcard h3{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--sunk);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column}
.stats b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.stats b.bad{color:var(--bad)}
.stats span{font-size:11px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.tl{display:grid;grid-template-columns:44px 22px minmax(0,1fr);gap:8px;align-items:start;position:relative;padding-bottom:6px}
.tl::before{content:"";position:absolute;left:62px;top:20px;bottom:-2px;width:2px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.tl.end::before{display:none}
.tl .t{font-size:12px;padding-top:3px;color:var(--muted)}
.pip{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c);margin:4px 5px 0;position:relative;z-index:1}
.num-pip{width:22px;height:22px;margin:0;background:var(--c);border:2px solid var(--surface);display:grid;place-items:center;color:#fff;font:700 11px var(--f-display)}
.tl.pause{font-size:12px;color:var(--muted)}
.tl.pause .pip{border-style:dashed;border-color:var(--muted)}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:none;border:0;padding:2px 0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.tl-head .muted{font-size:12px}
.tl.open .tl-head b{text-decoration:underline;text-underline-offset:3px}
.tl-more{display:flex;flex-direction:column;gap:4px;padding:4px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.calls{border-top:1px solid var(--line);padding-top:10px}
.calls h4{margin:0 0 6px;font:600 13px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.calls ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.calls li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
.map text.pin{fill:#fff;font:700 9px var(--f-display)}
.kpi .v small{font-size:16px;color:var(--muted)}
.hbar{display:flex;align-items:center;gap:8px;min-width:160px}
.hbar i{display:block;height:10px;border-radius:0 4px 4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><b>Rutas Comerciales</b></div>
    <nav class="tabs main" aria-label="Pantallas principales">
      <button data-tab="dia" aria-selected="true">Día</button>
      <button data-tab="semana" aria-selected="false">Semana</button>
    </nav>
    <nav class="tabs gest" aria-label="Gestión">
      <span class="gl">Gestión</span>
      <button data-tab="clientes" aria-selected="false">Clientes</button>
      <button data-tab="reparto" aria-selected="false">Reparto</button>
      <button data-tab="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="conn" class="notice" hidden></div>
  <section id="v-dia" class="stack"></section>
  <section id="v-semana" class="stack" hidden></section>
  <section id="v-clientes" class="stack" hidden></section>
  <section id="v-reparto" class="stack" hidden></section>
  <section id="v-ajustes" class="stack" hidden></section>
</main>
<div id="drawer-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== Motor de rutas (sin dependencias) =====
const Engine = (() => {
  const R = 6371;
  function hav(a, b) {
    const toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  // km por carretera estimados
  function roadKm(a, b, cfg) {
    const d = hav(a, b);
    if (d < 0.05) return 0.4; // mismo punto (misma calle/CP): desplazamiento mínimo
    return d * cfg.factorCarretera;
  }
  // velocidad media según longitud del tramo (urbano → autovía)
  function speed(km, cfg) {
    const pts = [[0, cfg.velUrbana], [10, (cfg.velUrbana + cfg.velCarretera) / 2], [30, cfg.velCarretera], [60, cfg.velAutovia]];
    if (km >= 60) return cfg.velAutovia;
    for (let i = 1; i < pts.length; i++) if (km <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return y0 + (y1 - y0) * (km - x0) / (x1 - x0);
    }
    return cfg.velAutovia;
  }
  function legMin(a, b, cfg) {
    const km = roadKm(a, b, cfg);
    return { km, min: km / speed(km, cfg) * 60 * cfg.factorTrafico };
  }
  // ---- TSP: vecino más cercano + 2-opt + or-opt (ida y vuelta a la nave) ----
  function buildMatrix(pts, cfg) {
    const n = pts.length, M = Array.from({ length: n }, () => new Float64Array(n));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const m = legMin(pts[i], pts[j], cfg).min; M[i][j] = M[j][i] = m; }
    return M;
  }
  function tourCost(t, M) { let c = 0; for (let i = 0; i < t.length - 1; i++) c += M[t[i]][t[i + 1]]; return c; }
  function solveTour(pts, cfg) {
    // pts[0] = nave
    const n = pts.length;
    if (n <= 1) return [0, 0];
    const M = buildMatrix(pts, cfg);

}
async function connect() {
  let db = null;

  try { S.dl = await claude.use('downloads'); } catch (e) { S.dl = null; }
  if (!db) {
    db = localDB(); const c = $('#conn'); c.hidden = false;
    c.textContent = 'Los cambios se guardan en este navegador y este dispositivo. Para pasarlos a otro equipo, usa Gestión › Ajustes › Copia de seguridad.';
  }
  S.db = db;
  await migrarDatos(db);
  db.collection('clientes').onSnapshot(snap => { S.clients = snap.docs.map(d => ({ ...d.data(), _doc: d.id })); S.clientsLoaded = true; render(); }, err => showErr(err));

function showErr(e) { const c = $('#conn'); c.hidden = false; c.textContent = 'Error de conexión con los datos compartidos (' + (e?.code || 'desconocido') + '). Recarga la página.'; }
function subscribeWeek() {

  const k = wkey(); S.week = { cambios: {} };
  S.weekUnsub = S.db.doc('semanas/' + k).onSnapshot(snap => { if (wkey() !== k) return; S.week = snap.exists ? { cambios: {}, ...snap.data() } : { cambios: {} }; render(); }, err => showErr(err));
}
let writing = Promise.resolve();

function saveClient(c, patch) {

  return queue(() => S.db.doc('clientes/' + (c._doc || ('c' + c.id))).set(body));
}

// ---------- Cálculo ----------
function enginePlan(clients, overrides, ser) {
  const cfg = cfgFull();
  return Engine.weekSummary(clients.filter(c => isFinite(c.lat)), cfg, ser ?? serial(), overrides ?? S.week.cambios);
}
function cycleSummary(clients, cfg) { // media de 4 semanas (ciclo de frecuencias 1/2/4)
  let km = 0, h = 0, ex = 0, v = 0; const per = {};
  for (let i = 0; i < 4; i++) {
    const w = Engine.weekSummary(clients.filter(c => isFinite(c.lat)), cfg, serial() + i, {});
    km += w.km; h += w.horas; ex += w.exceso; v += w.visitas;
    for (const k in w.slots) { const [r] = k.split('|'); per[r] = per[r] || { km: 0, h: 0, v: 0, n: 0 }; per[r].km += w.slots[k].km; per[r].h += w.slots[k].total / 60; per[r].v += w.slots[k].visitas.length; }
  }
  for (const r in per) { per[r].km /= 4; per[r].h /= 4; per[r].v /= 4; per[r].n = clients.filter(c => c.comercial === r && c.activo !== false).length; }
  return { km: km / 4, h: h / 4, ex: ex / 4, v: v / 4, per };
}

  ({ dia: renderDia, semana: renderSemana, clientes: renderClientes, reparto: renderReparto, ajustes: renderAjustes })[S.tab]();

function goWeek(d) {
  if (d === 0) { S.monday = Engine.mondayOf(new Date()); S.day = todayIdx(); }
  else { const x = new Date(S.monday); x.setDate(x.getDate() + 7 * d); S.monday = x; }
  subscribeWeek(); render();
}
function todayIdx() { const w = new Date().getDay(); return w >= 1 && w <= 5 ? w : 1; }
function bindWeekNav(root) { root.querySelectorAll('[data-wk]').forEach(b => b.onclick = () => goWeek(+b.dataset.wk)); }
function visibleReps() { return S.cfg.comerciales.filter(r => !S.repFilter || r.id === S.repFilter); }

// ---------- Barra de jornada (visual) ----------
function axisRange(routes) {
  const cfg = cfgFull(); const a = Engine.hm(cfg.salida);
  const last = Math.max(Engine.hm(cfg.fin), ...routes.map(r => r.finMin || a));
  return [a, Math.ceil((last + 15) / 60) * 60];
}
function segmentsOf(route) {
  const segs = []; let prevOut = null; const cfg = cfgFull(); let n = 0;
  for (const it of route.seq) {
    if (it.pausa) { const s = Engine.hm(it.hora); segs.push({ k: 'pausa', a: s, b: s + it.min, t: 'Pausa para comer ' + it.hora }); prevOut = s + it.min; continue; }
    n++; const ll = Engine.hm(it.llegada), sa = Engine.hm(it.salida);
    segs.push({ k: 'viaje', a: ll - it.min, b: ll, t: Math.round(it.min) + ' min de viaje' });
    segs.push({ k: 'visita', a: ll, b: sa, n, t: n + '. ' + it.stop.nombre + ' · ' + it.llegada + '–' + it.salida });
    prevOut = sa;
  }
  if (prevOut != null && route.finMin) segs.push({ k: 'viaje', a: prevOut, b: route.finMin, t: 'Vuelta a la nave' });
  return segs;
}
function jornadaBar(route, rep, range, opts = {}) {
  const [A, B] = range; const pct = m => ((m - A) / (B - A) * 100).toFixed(2) + '%'; const w = (a, b) => ((b - a) / (B - A) * 100).toFixed(2) + '%';
  const finCfg = Engine.hm(cfgFull().fin);
  const segs = segmentsOf(route);
  return `<div class="jb ${opts.small ? 'sm' : ''}" style="--c:${repColor(rep)}">
    <div class="jb-track">${segs.map(s => `<span class="seg ${s.k}" style="left:${pct(s.a)};width:${w(s.a, s.b)}" title="${esc(s.t)}">${s.k === 'visita' && !opts.small && (s.b - s.a) / (B - A) > .035 ? s.n : ''}</span>`).join('')}
      <i class="jb-fin" style="left:${pct(finCfg)}" title="Vuelta máxima ${cfgFull().fin}"></i></div></div>`;
}
function axisTicks(range) {
  const [A, B] = range; let h = '';
  for (let m = Math.ceil(A / 60) * 60; m <= B; m += 60) h += `<span class="${(m / 60) % 2 ? 'odd' : ''}" style="left:${((m - A) / (B - A) * 100).toFixed(2)}%">${String(m / 60).padStart(2, '0')}:00</span>`;
  return `<div class="jb-axis">${h}</div>`;
}
function jbLegend() { return `<div class="legend small muted"><span class="row" style="gap:6px"><i class="lg visita"></i>Visita</span><span class="row" style="gap:6px"><i class="lg viaje"></i>Conduciendo</span><span class="row" style="gap:6px"><i class="lg pausa"></i>Comida</span><span class="row" style="gap:6px"><i class="lg fin"></i>Vuelta máxima ${esc(cfgFull().fin)}</span></div>`; }

function repCard(r, route, d) {

  }).join('');

function mapDay(reps, routes) {
  const cfg = cfgFull(); const W = 720, H = 360; const nave = { lat: cfg.nave.lat, lng: cfg.nave.lng };
  const all = [nave]; routes.forEach(r => r.seq.forEach(x => { if (!x.pausa) all.push(x.stop); }));
  if (all.length < 3) all.push({ lat: nave.lat + .1, lng: nave.lng + .15 }, { lat: nave.lat - .1, lng: nave.lng - .15 });
  const P = projector(all, W, H, 22);
  const land = 'M' + OUTLINE.map(([lng, lat]) => P({ lat, lng }).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa con las rutas del día"><path class="land" d="${land}"/>`;
  const labels = new Set(); const seen = new Map(); const placed = [];
  reps.forEach((r, i) => {
    const seq = routes[i].seq.filter(x => !x.pausa).map(x => x.stop); if (!seq.length) return;
    g += `<polyline points="${[nave, ...seq, nave].map(p => P(p).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${repColor(r.id)}" stroke-width="2" stroke-linejoin="round" opacity=".8"/>`;
    seq.forEach((c, j) => { const [x, y] = P(c); const k = x.toFixed(0) + ',' + y.toFixed(0); const n = seen.get(k) || 0; seen.set(k, n + 1);
      const dx = (n % 4) * 8, dy = Math.floor(n / 4) * 8;
      g += `<circle cx="${(x + dx).toFixed(1)}" cy="${(y + dy).toFixed(1)}" r="7.5" fill="${repColor(r.id)}" stroke="var(--surface)" stroke-width="2"><title>${esc(r.nombre)} · ${j + 1}. ${esc(c.nombre)}</title></circle><text x="${(x + dx).toFixed(1)}" y="${(y + dy + 3).toFixed(1)}" text-anchor="middle" class="pin">${j + 1}</text>`;
      if (!labels.has(c.pob) && !placed.some(([px, py]) => Math.abs(px - x) < 70 && Math.abs(py - y) < 14)) { labels.add(c.pob); placed.push([x, y]); g += `<text x="${(x + 10).toFixed(1)}" y="${(y - 9).toFixed(1)}">${esc(c.pob)}</text>`; } });
  });
  const [nx, ny] = P(nave);
  g += `<rect x="${nx - 6}" y="${ny - 6}" width="12" height="12" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/><text x="${nx + 9}" y="${ny + 16}" style="fill:var(--fg)">Nave</text></svg>`;
  return g + '<p class="small muted">Ubicaciones aproximadas por población o código postal. Las líneas unen las paradas en orden; no siguen la carretera.</p>';
}

// ---------- Mapa SVG ----------
function projector(pts, W, H, pad) {
  const k = Math.cos(43.3 * Math.PI / 180);
  let x0 = Math.min(...pts.map(p => p.lng)), x1 = Math.max(...pts.map(p => p.lng)), y0 = Math.min(...pts.map(p => p.lat)), y1 = Math.max(...pts.map(p => p.lat));
  const mx = Math.max(.04, (x1 - x0) * .08), my = Math.max(.03, (y1 - y0) * .08); x0 -= mx; x1 += mx; y0 -= my; y1 += my;
  const sx = (W - 2 * pad) / ((x1 - x0) * k), sy = (H - 2 * pad) / (y1 - y0), s = Math.min(sx, sy);
  const ox = pad + ((W - 2 * pad) - (x1 - x0) * k * s) / 2, oy = pad + ((H - 2 * pad) - (y1 - y0) * s) / 2;
  return p => [ox + (p.lng - x0) * k * s, oy + (y1 - p.lat) * s];
}
function mapSvg({ route, rep, all }) {
  const cfg = cfgFull(); const W = 640, H = 380;
  const nave = { lat: cfg.nave.lat, lng: cfg.nave.lng };
  let pts;
  if (route) pts = [nave, ...route.seq.filter(x => !x.pausa).map(x => x.stop)];
  else pts = [nave, ...all.filter(c => isFinite(c.lat))];
  if (pts.length < 3) pts = pts.concat([{ lat: nave.lat + .08, lng: nave.lng + .12 }, { lat: nave.lat - .08, lng: nave.lng - .12 }]);
  const P = projector(route ? pts : OUTLINE.map(([lng, lat]) => ({ lat, lng })).concat(pts), W, H, 14);
  const land = 'M' + OUTLINE.map(([lng, lat]) => P({ lat, lng }).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de ${route ? 'la ruta' : 'clientes por comercial'}"><path class="land" d="${land}"/>`;
  if (route) {
    const seq = route.seq.filter(x => !x.pausa).map(x => x.stop);
    const line = [nave, ...seq, nave].map(p => P(p).map(v => v.toFixed(1)).join(',')).join(' ');
    g += `<polyline points="${line}" fill="none" stroke="${repColor(rep)}" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>`;
    const seen = new Map();
    seq.forEach((c, i) => { const [x, y] = P(c); const key = x.toFixed(0) + ',' + y.toFixed(0); const n = seen.get(key) || 0; seen.set(key, n + 1);
      const dx = n * 9; g += `<circle cx="${x + dx}" cy="${y}" r="9" fill="${repColor(rep)}" stroke="var(--surface)" stroke-width="2"/><text x="${x + dx}" y="${y + 3.5}" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">${i + 1}</text>`; });
    const lab = new Set(); seq.forEach(c => { if (lab.has(c.pob)) return; lab.add(c.pob); const [x, y] = P(c); g += `<text x="${x + 12}" y="${y - 10}">${esc(c.pob)}</text>`; });
  } else {
    for (const c of all) { if (!isFinite(c.lat)) continue; const [x, y] = P(c); const jx = ((String(c.id).charCodeAt(0) * 37 + (+c.id || 0) * 13) % 9) - 4, jy = (((+c.id || 0) * 7) % 9) - 4;
      g += `<circle cx="${(x + jx).toFixed(1)}" cy="${(y + jy).toFixed(1)}" r="4.5" fill="${c.comercial ? repColor(c.comercial) : 'var(--muted)'}" stroke="var(--surface)" stroke-width="1" opacity=".9"><title>${esc(c.nombre)} · ${esc(c.pob)} · ${esc(repName(c.comercial))} ${c.dia ? DIAS[c.dia] : ''}</title></circle>`; }
    const towns = ['Santander', 'Torrelavega', 'Laredo', 'Castro Urdiales', 'San Vicente De La Barquera', 'Reinosa', 'Santoña', 'Suances'];
    const done = new Set(); for (const c of all) { if (!towns.includes(c.pob) || done.has(c.pob)) continue; done.add(c.pob); const [x, y] = P(c); g += `<text x="${x + 7}" y="${y - 7}">${esc(c.pob.replace(' De La Barquera', ''))}</text>`; }
  }
  const [nx, ny] = P(nave);
  g += `<rect x="${nx - 6}" y="${ny - 6}" width="12" height="12" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/><text x="${nx + 9}" y="${ny + 16}" style="fill:var(--fg)">Nave</text></svg>`;
  return g + (route ? '<p class="small muted">Posiciones aproximadas por población o código postal. El trazado es el orden de visita, no la carretera.</p>' : '');
}

async function importExcel(file) {
  if (!file) return;
  if (!window.XLSX) { toast('No se ha podido cargar el lector de Excel'); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer());
    const ws = wb.Sheets['Clientes'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    const hdr = rows[0].map(h => String(h || '').trim().toLowerCase());
    const col = n => hdr.findIndex(h => h.startsWith(n));
    const ci = { id: col('código'), nom: col('nombre'), raz: col('razón'), tipo: col('tipo'), dir: col('dirección'), cp: col('cp'), pob: col('población'), prov: col('provincia'), tel: col('teléfono'), mov: col('móvil'), mail: col('correo'), nota: col('nota') };
    const existing = new Set(S.clients.map(c => String(c.id)));
    const nuevos = [];
    for (const r of rows.slice(1)) {
      if (r[ci.id] == null) continue;
      if (String(r[ci.tipo] || '').trim() !== 'Empresa' || String(r[ci.prov] || '').trim() !== 'Cantabria') continue;
      if (existing.has(String(r[ci.id]))) continue;
      const c = { id: r[ci.id], nombre: String(r[ci.nom] || '').trim(), razon: String(r[ci.raz] || '').trim(), dir: String(r[ci.dir] || '').trim(), cp: String(r[ci.cp] || ''), pob: String(r[ci.pob] || '').trim(), tel: r[ci.tel] || r[ci.mov] || null, email: r[ci.mail] || null, nota: r[ci.nota] || null, frecuencia: 1, llamarEntreVisitas: true, activo: true, cerrado: [], fijado: false, desfase: 0 };
      const geo = geoFromCP(c.cp, c.pob); if (geo) Object.assign(c, geo);
      const nota = String(c.nota || '').toLowerCase(); [['lunes', 1], ['martes', 2], ['miércoles', 3], ['jueves', 4], ['viernes', 5]].forEach(([w, d]) => { if (nota.includes(w + ' cerrado') || nota.includes('cerrado ' + w)) c.cerrado.push(d); });
      nuevos.push(c);
    }
    if (!nuevos.length) { toast('No hay clientes empresa de Cantabria nuevos en el archivo'); return; }
    const cfg = cfgFull(); const pool = S.clients.slice();
    for (const c of nuevos) { if (isFinite(c.lat)) { const b = Engine.bestSlot(c, pool, cfg); if (b) { c.comercial = b.rep; c.dia = b.day; } } c._doc = 'c' + String(c.id).replace(/[^A-Za-z0-9_-]/g, ''); pool.push(c); }
    openDrawer(`<div class="stack"><h2>${nuevos.length} clientes nuevos</h2><p class="small muted">Solo se añaden clientes empresa de Cantabria con un código que aún no existe. Cada uno va al comercial y día que menos tiempo añade a la ruta.</p>
      <table><tbody>${nuevos.map(c => `<tr><td><b>${esc(c.nombre)}</b><div class="small muted">${esc(c.pob)}</div></td><td class="small">${c.comercial ? esc(repName(c.comercial)) + ' · ' + DIAS[c.dia] : '<span class="chip warn">Sin ubicación</span>'}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn primary" id="imp-ok">Añadir ${nuevos.length} clientes</button><button class="btn" data-close>Cancelar</button></div></div>`, el => {
      $('#imp-ok', el).onclick = async () => { $('#imp-ok', el).disabled = true; for (const c of nuevos) { S.clients.push(c); await saveClient(c, {}); } closeDrawer(); render(); toast(nuevos.length + ' clientes añadidos'); };
    });
  } catch (e) { toast('No se ha podido leer el archivo: ' + (e.message || e)); }
}
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n'); }
async function offer(filename, text, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([text], { type });
  if (S.dl) { try { await S.dl.save({ filename, data: blob }); } catch (e) { if (e?.code !== 'declined') toast('Descarga no completada'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function seedInicial() {
  const b = $('#seed-go'); if (b) b.disabled = true;
  if (!S.cfgLoaded || !S.cfg.comerciales) { S.cfg = structuredClone(DATOS_INICIALES.config); }
  await queue(() => S.db.doc('config/general').set(structuredClone(DATOS_INICIALES.config)));
  let i = 0; for (const c of DATOS_INICIALES.clientes) { await S.db.doc('clientes/c' + c.id).set(c); if (b && ++i % 10 === 0) b.textContent = 'Cargando ' + i + '/' + DATOS_INICIALES.clientes.length; }
  await S.db.doc('meta/datos').set({ version: DATA_VERSION });
  toast('Clientes cargados');
}
async function backupExport() {
  let data;
  if (S.db.dump) data = S.db.dump();
  else { data = { 'config/general': S.cfg }; for (const c of S.clients) { const { _doc, ...b } = c; data['clientes/' + (_doc || 'c' + c.id)] = b; } data['semanas/' + wkey()] = S.week; }
  offer('rutas-copia-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ tipo: 'rutas-comerciales', fecha: new Date().toISOString(), datos: data }, null, 1), 'application/json');
}
async function backupImport(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text()); if (j.tipo !== 'rutas-comerciales' || !j.datos) throw new Error('No es una copia de este planificador');
    if (S.db.load) S.db.load(j.datos);
    else { for (const [k, v] of Object.entries(j.datos)) await S.db.doc(k).set(v); }
    toast('Copia restaurada');
  } catch (e) { toast('No se ha podido restaurar: ' + e.message); }
}
function exportClients() {
  const rows = [['Código', 'Nombre', 'Dirección', 'CP', 'Población', 'Comercial', 'Día', 'Frecuencia', 'Llamar entre visitas', 'Duración min', 'Cierra', 'Fijado', 'Activo', 'Lat', 'Lng', 'Precisión', 'Teléfono', 'Nota']];
  for (const c of S.clients) rows.push([c.id, c.nombre, c.dir, c.cp, c.pob, repName(c.comercial), c.dia ? DIAS[c.dia] : '', freqLabel(c.frecuencia), c.llamarEntreVisitas !== false ? 'Sí' : 'No', c.dur || cfgFull().durVisita, (c.cerrado || []).map(d => DIAS[d]).join(' '), c.fijado ? 'Sí' : 'No', c.activo !== false ? 'Sí' : 'No', c.lat, c.lng, c.prec, c.tel, c.nota]);
  offer('clientes-rutas.csv', csv(rows));
}
function exportWeek(plan) {
  const rows = [['Semana', 'Comercial', 'Día', 'Fecha', 'Orden', 'Tipo', 'Hora llegada', 'Hora salida', 'Cliente', 'Dirección', 'Población', 'Teléfono', 'Km tramo']];
  for (const r of S.cfg.comerciales) for (let d = 1; d <= 5; d++) {
    const s = plan.slots[r.id + '|' + d]; let i = 0;
    for (const it of s.seq) if (!it.pausa) rows.push([wkey(), r.nombre, DIAS[d], dateOf(d).toLocaleDateString('es-ES'), ++i, 'Visita', it.llegada, it.salida, it.stop.nombre, it.stop.dir, it.stop.pob, it.stop.tel, it.km.toFixed(1)]);
    for (const c of s.llamadas) rows.push([wkey(), r.nombre, DIAS[d], dateOf(d).toLocaleDateString('es-ES'), '', 'Llamada', '', '', c.nombre, c.dir, c.pob, c.tel, '']);
  }
  offer('rutas-' + wkey() + '.csv', csv(rows));
}

// ---------- Reparto ----------
function renderReparto() {
  const v = $('#v-reparto'); const cfg = cfgFull();
  const cur = cycleSummary(S.clients, cfg);
  const n = S.simN || cfg.comerciales.length;
  let html = `<div class="row" style="justify-content:space-between"><h2>Reparto de clientes</h2></div>
  <div class="split"><div class="panel stack"><h3>Reparto actual</h3>
    <div class="legend">${cfg.comerciales.map(r => `<span class="row" style="gap:6px"><span class="dot" style="background:${repColor(r.id)}"></span>${esc(r.nombre)}</span>`).join('')}</div>
    <div class="map">${mapSvg({ all: S.clients.filter(c => c.activo !== false) })}</div></div>
    <div class="panel stack"><h3>Carga media semanal</h3><p class="small muted">Media de 4 semanas, para que cuenten las visitas cada 2 y cada 4 semanas.</p>
    <table class="cmp"><thead><tr><th>Comercial</th><th class="num">Visitas</th><th class="num">Km</th><th class="num">Horas</th></tr></thead><tbody>
    ${cfg.comerciales.map(r => { const p = cur.per[r.id] || { n: 0, v: 0, km: 0, h: 0 }; return `<tr><td><span class="dot" style="background:${repColor(r.id)}"></span> ${esc(r.nombre)}</td><td class="num mono">${p.v.toFixed(1)}</td><td class="num mono">${Math.round(p.km)}</td><td class="num mono">${p.h.toFixed(1)}</td></tr>`; }).join('')}
    <tr><td><b>Total</b></td><td class="num mono"><b>${cur.v.toFixed(1)}</b></td><td class="num mono"><b>${Math.round(cur.km)}</b></td><td class="num mono"><b>${cur.h.toFixed(1)}</b></td></tr></tbody></table>
    <h3>Proponer un reparto nuevo</h3>
    <p class="small muted">Agrupa a los clientes por zonas, reparte la carga entre comerciales y días, evita los días de cierre y respeta los clientes fijados. Puedes simular con más o menos comerciales antes de aplicar.</p>
    <div class="row"><label class="f">Comerciales<input type="number" id="rp-n" min="1" max="6" value="${n}"></label>
      <label class="row small"><input type="checkbox" id="rp-fij" checked> Respetar clientes fijados</label>
      <button class="btn primary" id="rp-go">Calcular propuesta</button></div>
    <div id="rp-res"></div></div></div>`;
  v.innerHTML = html;
  $('#rp-n').onchange = e => { S.simN = Math.max(1, Math.min(6, +e.target.value || 1)); };
  $('#rp-go').onclick = () => {
    const N = Math.max(1, Math.min(6, +$('#rp-n').value || 1));
    const reps = []; for (let i = 0; i < N; i++) reps.push(cfg.comerciales[i] || { id: 'c' + (i + 1) + '-' + Date.now().toString(36).slice(-3), nombre: 'Comercial ' + (i + 1), nuevo: true });
    const cfgN = { ...cfg, comerciales: reps };
    const work = S.clients.map(c => ({ ...c }));
    $('#rp-res').innerHTML = '<p class="small muted">Calculando…</p>';
    setTimeout(() => {
      const p = Engine.propose(work, cfgN, { respetarFijados: $('#rp-fij').checked });
      work.forEach(c => { const a = p.assign.get(c.id); if (a) { c.comercial = a.rep; c.dia = a.day; c.desfase = p.desfase.has(c.id) ? p.desfase.get(c.id) : (c.desfase || 0); } });
      const prop = cycleSummaryWith(work, cfgN);
      const moved = work.filter(c => { const o = S.clients.find(x => x.id === c.id); return o && (o.comercial !== c.comercial || o.dia !== c.dia); }).length;
      S.propuesta = { work, cfgN };
      const d = (a, b, u) => { const x = b - a; return `<span class="chip ${x < 0 ? 'ok' : x > 0 ? 'warn' : ''}">${x > 0 ? '+' : ''}${u === 'h' ? x.toFixed(1) : Math.round(x)} ${u}</span>`; };
      $('#rp-res').innerHTML = `<div class="stack"><table class="cmp"><thead><tr><th></th><th class="num">Actual</th><th class="num">Propuesta</th><th class="num">Diferencia</th></tr></thead><tbody>
        <tr><td>Km por semana</td><td class="num mono">${Math.round(cur.km)}</td><td class="num mono">${Math.round(prop.km)}</td><td class="num">${d(cur.km, prop.km, 'km')}</td></tr>
        <tr><td>Horas en ruta por semana</td><td class="num mono">${cur.h.toFixed(1)}</td><td class="num mono">${prop.h.toFixed(1)}</td><td class="num">${d(cur.h, prop.h, 'h')}</td></tr>
        <tr><td>Minutos fuera de horario</td><td class="num mono">${Math.round(cur.ex)}</td><td class="num mono">${Math.round(prop.ex)}</td><td class="num">${d(cur.ex, prop.ex, 'min')}</td></tr>
        ${reps.map(r => { const q = prop.per[r.id] || { n: 0, h: 0, km: 0 }; return `<tr><td><span class="dot" style="background:${REP_COLORS[reps.indexOf(r) % 6]}"></span> ${esc(r.nombre)}</td><td></td><td class="num mono">${q.h.toFixed(1)} h · ${Math.round(q.km)} km</td><td></td></tr>`; }).join('')}
        </tbody></table>
        <p class="small muted">${moved} clientes cambian de comercial o de día.${N !== cfg.comerciales.length ? ` Al aplicar, el equipo pasa a ${N} comerciales.` : ''}</p>
        <div class="row"><button class="btn primary" id="rp-apply">Aplicar propuesta</button><button class="btn" id="rp-cancel">Descartar</button></div></div>`;
      $('#rp-cancel').onclick = () => { S.propuesta = null; $('#rp-res').innerHTML = ''; };
      $('#rp-apply').onclick = applyPropuesta;
    }, 30);
  };
}
function cycleSummaryWith(clients, cfg) { return cycleSummary(clients, cfg); }
async function applyPropuesta() {
  const p = S.propuesta; if (!p) return; const btn = $('#rp-apply'); btn.disabled = true;
  if (p.cfgN.comerciales.length !== S.cfg.comerciales.length) { S.cfg.comerciales = p.cfgN.comerciales.map(({ nuevo, ...r }) => r); await saveCfg(); }
  let i = 0;
  for (const w of p.work) {
    const c = S.clients.find(x => x.id === w.id); if (!c) continue;
    if (c.comercial !== w.comercial || c.dia !== w.dia || (c.desfase || 0) !== (w.desfase || 0)) { await saveClient(c, { comercial: w.comercial, dia: w.dia, desfase: w.desfase || 0 }); }
    if (++i % 10 === 0) btn.textContent = 'Guardando ' + i + '/' + p.work.length;
  }
  S.propuesta = null; render(); toast('Reparto aplicado');
}

// ---------- Ajustes ----------
function renderAjustes() {
  const v = $('#v-ajustes'); const c = cfgFull();
  const num = (id, val, label, step = 1) => `<label class="f">${label}<input type="number" id="${id}" value="${val}" step="${step}"></label>`;
  v.innerHTML = `<h2>Ajustes</h2>
  <div class="split"><div class="panel stack"><h3>Comerciales</h3>
    <div id="aj-reps" class="stack">${S.cfg.comerciales.map((r, i) => `<div class="row"><span class="dot" style="background:${repColor(r.id)}"></span><input data-rep="${r.id}" value="${esc(r.nombre)}" style="flex:1" aria-label="Nombre del comercial">${S.cfg.comerciales.length > 1 ? `<button class="btn sm ghost" data-del="${r.id}">Quitar</button>` : ''}</div>`).join('')}</div>
    <div class="row"><button class="btn" id="aj-add">Añadir comercial</button></div>
    <p class="small muted">Al quitar un comercial, sus clientes quedan sin asignar. Usa Reparto para redistribuirlos.</p>
    <h3>Nave (punto de salida y vuelta)</h3>
    <label class="f">Nombre<input id="aj-nn" value="${esc(c.nave.nombre)}"></label>
    <label class="f">Coordenadas (pega "lat, lng" de Google Maps)<input id="aj-nc" value="${c.nave.lat}, ${c.nave.lng}"></label>
    <h3>Copia de seguridad</h3>
    <p class="small muted">Descarga todos los datos (clientes, reparto, cambios de semanas y ajustes) en un archivo, o restaura una copia anterior.</p>
    <div class="row"><button class="btn" id="bk-exp">Descargar copia</button><label class="btn" for="bk-imp">Restaurar copia</label><input type="file" id="bk-imp" accept=".json" hidden></div>
    </div>
  <div class="panel stack"><h3>Jornada</h3>
    <div class="row"><label class="f">Salida<input type="time" id="aj-sal" value="${c.salida}"></label><label class="f">Vuelta máxima<input type="time" id="aj-fin" value="${c.fin}"></label></div>
    <div class="row"><label class="row small"><input type="checkbox" id="aj-com" ${c.comida.activa ? 'checked' : ''}> Pausa para comer</label><label class="f">Desde<input type="time" id="aj-ci" value="${c.comida.inicio}"></label>${num('aj-cm', c.comida.minutos, 'Minutos')}</div>
    <h3>Tiempos por parada</h3>
    <div class="row">${num('aj-dv', c.durVisita, 'Visita (min)')}${num('aj-dl', c.durLlamada, 'Llamada (min)')}${num('aj-ap', c.minAparcar, 'Aparcar / entrar (min)')}</div>
    <h3>Cálculo de trayectos</h3>
    <p class="small muted">Los km por carretera se estiman como la distancia en línea recta por un factor. Si los tiempos reales salen más largos, sube el factor de tráfico.</p>
    <div class="row">${num('aj-fc', c.factorCarretera, 'Factor carretera', .05)}${num('aj-ft', c.factorTrafico, 'Factor tráfico', .05)}</div>
    <div class="row">${num('aj-vu', c.velUrbana, 'Vel. ciudad km/h')}${num('aj-vc', c.velCarretera, 'Vel. carretera km/h')}${num('aj-va', c.velAutovia, 'Vel. autovía km/h')}</div>
    <div class="row"><button class="btn primary" id="aj-save">Guardar ajustes</button></div></div></div>`;
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const id = b.dataset.del; S.cfg.comerciales = S.cfg.comerciales.filter(r => r.id !== id); await saveCfg(); for (const cl of S.clients.filter(x => x.comercial === id)) await saveClient(cl, { comercial: null, fijado: false }); render(); });
  $('#bk-exp').onclick = backupExport; $('#bk-imp').onchange = e => backupImport(e.target.files[0]);
  $('#aj-add').onclick = () => { const n = S.cfg.comerciales.length + 1; S.cfg.comerciales.push({ id: 'c' + n + '-' + Date.now().toString(36).slice(-4), nombre: 'Comercial ' + n }); saveCfg(); render(); };
  $('#aj-save').onclick = () => {
    const g = id => $(id).value; const nc = g('#aj-nc').match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);
    v.querySelectorAll('[data-rep]').forEach(i => { const r = S.cfg.comerciales.find(x => x.id === i.dataset.rep); if (r) r.nombre = i.value.trim() || r.nombre; });
    Object.assign(S.cfg, { salida: g('#aj-sal'), fin: g('#aj-fin'), comida: { activa: $('#aj-com').checked, inicio: g('#aj-ci'), minutos: +g('#aj-cm') || 0 },
      durVisita: +g('#aj-dv') || 30, durLlamada: +g('#aj-dl') || 10, minAparcar: +g('#aj-ap') || 0, factorCarretera: +g('#aj-fc') || 1.3, factorTrafico: +g('#aj-ft') || 1,
      velUrbana: +g('#aj-vu') || 22, velCarretera: +g('#aj-vc') || 60, velAutovia: +g('#aj-va') || 85,
      nave: { nombre: g('#aj-nn'), lat: nc ? +nc[1] : c.nave.lat, lng: nc ? +nc[2] : c.nave.lng } });
    saveCfg(); render();
  };
}

document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; try { localStorage.setItem('rc_tab', S.tab); } catch (e) {} render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
render();
connect();
</script>

</body>
</html>
